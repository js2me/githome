name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc && pnpm exec tsc -p tsconfig.node.json
      - run: pnpm lint:check
      - run: pnpm test
      - name: Browser checks
        shell: bash
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          pnpm dev --host 127.0.0.1 > "$RUNNER_TEMP/githome-vite.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          export BASE=http://127.0.0.1:1420
          if ! curl --fail --retry 30 --retry-connrefused --retry-delay 1 --silent "$BASE/" > /dev/null; then
            cat "$RUNNER_TEMP/githome-vite.log"
            exit 1
          fi
          pnpm check:browser
          pnpm check:browser:forge
