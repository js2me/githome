name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GITHOME_RELEASE_VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      CI: true
      ELECTRON: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set desktop release version
        shell: bash
        run: node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.env.GITHOME_RELEASE_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'

      - name: Build frontend and Electron bundles
        run: pnpm build:app

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          if-no-files-found: error
          path: |
            dist
            dist-electron

  package:
    needs: build-app
    permissions:
      contents: read
    env:
      CI: true
      ELECTRON: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
            platform: linux
          - os: windows-latest
            artifact: windows
            platform: win
          - os: macos-15-intel
            artifact: macos
            platform: mac

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download app bundles
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: .

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary is installed
        run: node node_modules/electron/install.js

      - name: Set desktop release version
        shell: bash
        run: node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.env.GITHOME_RELEASE_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'

      - name: Package desktop app
        if: matrix.platform != 'mac'
        run: pnpm package:${{ matrix.platform }}

      - name: Package macOS app
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          else
            : "${CSC_KEY_PASSWORD:?}" "${APPLE_ID:?}" "${APPLE_APP_SPECIFIC_PASSWORD:?}" "${APPLE_TEAM_ID:?}"
          fi
          pnpm package:mac --universal

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap

  android:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          export GITHOME_ANDROID_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          mkdir -p android-release
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            pnpm build:android
            cp android/app/build/outputs/apk/debug/app-debug.apk android-release/
          else
            : "${ANDROID_KEYSTORE_PASSWORD:?}" "${ANDROID_KEY_ALIAS:?}" "${ANDROID_KEY_PASSWORD:?}"
            export GITHOME_ANDROID_KEYSTORE="$RUNNER_TEMP/githome-android.keystore"
            trap 'rm -f "$GITHOME_ANDROID_KEYSTORE"' EXIT
            (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHOME_ANDROID_KEYSTORE")
            pnpm build:android:release
            apk=android/app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
            cp "$apk" android-release/githome-android.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: android-release/*.apk

  release:
    needs: [package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release-artifacts

      - name: Package Chrome extension
        working-directory: extensions/chrome
        run: zip -q ../../release-artifacts/githome-chrome.zip manifest.json *.html *.css *.js content/*.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GITHOME_RELEASE_VERSION }}
          name: GitHome ${{ env.GITHOME_RELEASE_VERSION }}
          generate_release_notes: false
          body: |
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ${{ github.event.head_commit.message }}
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.apk
            release-artifacts/latest*.yml
            release-artifacts/*.blockmap
          draft: false
          prerelease: false
