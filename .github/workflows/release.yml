name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GITHOME_RELEASE_VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      CI: true
      ELECTRON: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set desktop release version
        shell: bash
        run: node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.env.GITHOME_RELEASE_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'

      - name: Build frontend and Electron bundles
        run: pnpm build:app

      - name: Upload app bundles
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          if-no-files-found: error
          path: |
            dist
            dist-electron

  package:
    needs: build-app
    permissions:
      contents: read
    env:
      CI: true
      ELECTRON: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
            platform: linux
          - os: windows-latest
            artifact: windows
            platform: win

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Download app bundles
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: .

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron binary is installed
        run: node node_modules/electron/install.js

      - name: Set desktop release version
        shell: bash
        run: node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.env.GITHOME_RELEASE_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'

      - name: Package desktop app
        run: pnpm package:${{ matrix.platform }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/latest*.yml
            release/*.blockmap

  android:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: pnpm build:android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [package, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.GITHOME_RELEASE_VERSION }}
          name: GitHome ${{ env.GITHOME_RELEASE_VERSION }}
          generate_release_notes: false
          body: |
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ${{ github.event.head_commit.message }}
          files: |
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.exe
            release-artifacts/*.apk
            release-artifacts/latest*.yml
            release-artifacts/*.blockmap
          draft: false
          prerelease: false
